<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>todo app</title><script defer src=main.js></script></head><body><div class=container><div class=nav><h3 class=nav-header>projects</h3><button class=add-project>add project</button><div class=nav-items></div></div><div class=header><h2 class=project-title>todo-list</h2><button class=project-dl-btn>delete project</button></div><div class=main><dialog id=task-inputs><form action><label for=task-title>Task title</label> <input placeholder="enter task title" id=task-title> <label for=task-date>Task Date</label> <input type=date id=task-date> <label for=task-description>Task Description</label> <input placeholder="enter task description" id=task-description> <label for=task-priority>Task Priority</label> <select name=task-priority id=task-priority><option value=low>low<option value=medium>medium<option value=high>high</select> <button class=submit-task>submit</button></form></dialog><button class=add-task>add task</button><div class=tasks><h3 class=uncompleted-header>uncompleted</h3><div class=uncompleted></div><h3 class=completed-header>completed</h3><div class=completed></div></div></div></div></body></html>
